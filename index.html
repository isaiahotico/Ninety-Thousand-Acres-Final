<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamly Video App</title>
  <style>
    :root{--bg:#0f0f0f;--card:#181818;--soft:#272727;--text:#fff;--muted:#aaa;--accent:#ff3158;--line:#303030}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.topbar{height:64px;padding:0 22px;display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:#0f0ff5}.brand{font-size:22px;font-weight:800;white-space:nowrap}.brand span{color:var(--accent)}.search{display:flex;flex:1;max-width:680px;margin:auto}.search input{flex:1;padding:12px 16px;background:#101010;color:#fff;border:1px solid var(--line);border-radius:24px 0 0 24px;outline:0}.search button{width:56px;border-radius:0 24px 24px 0;background:var(--soft);color:#fff}.icon{background:transparent;color:#fff;font-size:20px}.avatar{width:34px;height:34px;border-radius:50%;background:#7c3aed;color:#fff;font-weight:bold}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:230px;padding:18px 12px;border-right:1px solid var(--line);position:fixed;top:64px;bottom:0;overflow:auto}.nav{display:block;width:100%;padding:12px 15px;text-align:left;background:none;color:#ddd;border-radius:10px;margin-bottom:4px}.nav:hover,.nav.active{background:var(--soft);color:#fff}.nav-title{color:var(--muted);font-size:12px;font-weight:bold;text-transform:uppercase;padding:22px 15px 8px}main{margin-left:230px;width:calc(100% - 230px);padding:24px}.chips{display:flex;gap:10px;overflow:auto;padding-bottom:20px}.chip{background:var(--soft);color:#fff;border-radius:18px;padding:9px 16px;white-space:nowrap}.chip.active{background:#fff;color:#111}.section-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}h1{font-size:24px}.secondary,.primary{padding:11px 18px;border-radius:22px}.secondary{background:var(--soft);color:#fff}.primary{background:var(--accent);color:#fff;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 18px}.card{cursor:pointer}.thumb{aspect-ratio:16/9;overflow:hidden;position:relative;border-radius:10px;background:#333}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:7px;bottom:7px;background:#000c;padding:4px 6px;border-radius:4px;font-size:12px}.info{display:flex;gap:11px;padding-top:11px}.channel{flex:0 0 36px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:bold}.vtitle{font-weight:bold;line-height:1.3;margin:0 0 7px}.meta{color:var(--muted);font-size:13px;line-height:1.5}.empty{text-align:center;color:var(--muted);padding:50px}.modal-bg{display:none;position:fixed;inset:0;background:#000b;z-index:10;place-items:center;padding:20px}.modal-bg.show{display:grid}.modal{width:min(520px,100%);background:var(--card);padding:25px;border-radius:14px}.modal input,.modal textarea{width:100%;margin:8px 0 14px;padding:12px;border-radius:8px;border:1px solid var(--line);background:#111;color:#fff}.modal textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:10px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);opacity:0;background:#fff;color:#111;padding:12px 20px;border-radius:25px;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:760px){aside{width:64px;padding:12px 8px}.nav{font-size:0;text-align:center;padding:12px 0}.nav-title{display:none}main{margin-left:64px;width:calc(100% - 64px);padding:16px 12px}.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.topbar{padding:0 10px;gap:10px}.brand{font-size:18px}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="topbar"><button class="icon" id="menuBtn">☰</button><div class="brand">stream<span>ly</span></div><form class="search" id="searchForm"><input id="searchInput" type="search" placeholder="Search videos"><button>⌕</button></form><button class="icon" id="uploadBtn">＋</button><button class="icon" id="themeBtn">☼</button><button class="avatar">JD</button></header>
<div class="layout"><aside id="sidebar"><button class="nav active" data-page="Home">⌂ &nbsp; Home</button><button class="nav" data-page="Trending">♨ &nbsp; Trending</button><button class="nav" data-page="Subscriptions">▣ &nbsp; Subscriptions</button><div class="nav-title">Library</div><button class="nav" data-page="History">◷ &nbsp; History</button><button class="nav" data-page="Watch later">◉ &nbsp; Watch later</button><button class="nav" data-page="Liked videos">♡ &nbsp; Liked videos</button><div class="nav-title">Explore</div><button class="nav" data-category="Music">♫ &nbsp; Music</button><button class="nav" data-category="Gaming">♙ &nbsp; Gaming</button><button class="nav" data-category="Technology">⚙ &nbsp; Technology</button></aside><main><div class="chips" id="chips"></div><div class="section-head"><h1 id="pageTitle">Recommended for you</h1><button class="secondary" id="refreshBtn">↻ Refresh</button></div><section class="grid" id="videoGrid"></section></main></div>
<div class="modal-bg" id="uploadModal"><form class="modal" id="uploadForm"><h2>Upload a video</h2><label>Title<input id="videoTitle" required placeholder="Video title"></label><label>Image URL<input id="videoUrl" type="url" required placeholder="https://...jpg"></label><label>Description<textarea id="videoDescription" placeholder="Description"></textarea></label><div class="actions"><button type="button" class="secondary" id="closeModal">Cancel</button><button class="primary">Publish</button></div></form></div><div class="toast" id="toast"></div><script src="app.js"></script>
</body></html>
