<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ninety thousand Acres Team</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: 'rgb(var(--brand) / <alpha-value>)' } } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root { --brand: 37 99 235; }
    * { scrollbar-width: thin; scrollbar-color: rgb(var(--brand)) transparent; }
    body { font-family: Inter, sans-serif; background: #f8fafc; }
    .glass { background: rgba(255,255,255,.86); backdrop-filter: blur(14px); }
    .message img { max-width: min(320px, 100%); max-height: 280px; object-fit: cover; }
    .scroll { overflow-y: auto; }
    .active-tab { color: rgb(var(--brand)); background: rgb(var(--brand) / .10); }
    button, input, textarea, select { outline-color: rgb(var(--brand)); }
    .loader { width: 18px; height:18px; border: 2px solid #ddd; border-top-color: rgb(var(--brand)); border-radius:50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-slate-800">
  <div id="toast" class="fixed top-4 right-4 z-50 hidden rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-xl"></div>

  <header class="glass sticky top-0 z-40 border-b border-slate-200">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3">
      <div class="flex min-w-0 items-center gap-3">
        <div class="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-brand text-xl font-black text-white shadow-lg">90K</div>
        <div class="min-w-0"><h1 class="truncate text-lg font-extrabold">Ninety thousand Acres Team</h1><p class="text-xs text-slate-500">Connect • Share • Grow</p></div>
      </div>
      <div class="flex items-center gap-2">
        <span id="onlineCount" class="hidden rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700 sm:inline">0 online</span>
        <button id="colorButton" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white hover:bg-slate-50" title="Change app color"><i class="fa-solid fa-palette"></i></button>
        <input id="colorPicker" type="color" value="#2563eb" class="absolute right-4 top-16 hidden h-10 w-10 cursor-pointer rounded-lg border-0 p-0">
        <button id="profileButton" class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white p-1 pr-3 hover:bg-slate-50"><img id="headerAvatar" class="h-8 w-8 rounded-lg object-cover" alt="Profile"><span id="headerName" class="hidden max-w-28 truncate text-sm font-semibold sm:block">Guest</span></button>
      </div>
    </div>
  </header>

  <main class="mx-auto grid max-w-7xl gap-5 px-4 py-5 lg:grid-cols-[210px_1fr_260px]">
    <nav class="glass flex gap-2 overflow-x-auto rounded-2xl border border-slate-200 p-2 lg:block lg:h-fit lg:space-y-2">
      <button data-tab="chat" class="nav-btn active-tab flex shrink-0 items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold lg:w-full"><i class="fa-solid fa-comments w-5"></i>Chat</button>
      <button data-tab="forum" class="nav-btn flex shrink-0 items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold lg:w-full"><i class="fa-solid fa-layer-group w-5"></i>Forum</button>
      <button data-tab="groups" class="nav-btn flex shrink-0 items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold lg:w-full"><i class="fa-solid fa-users w-5"></i>Groups</button>
      <button data-tab="profile" class="nav-btn flex shrink-0 items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold lg:w-full"><i class="fa-solid fa-user w-5"></i>Profile</button>
    </nav>

    <section id="app" class="min-w-0"></section>

    <aside class="hidden lg:block">
      <div class="glass rounded-2xl border border-slate-200 p-4"><div class="mb-3 flex items-center justify-between"><h2 class="font-bold">Online now</h2><span class="h-2 w-2 rounded-full bg-emerald-500"></span></div><div id="onlineUsers" class="space-y-3"><p class="text-sm text-slate-500">Loading…</p></div></div>
      <div class="mt-4 rounded-2xl bg-brand p-5 text-white shadow-lg"><i class="fa-solid fa-bolt mb-3 text-2xl"></i><h3 class="font-bold">Fast community chat</h3><p class="mt-1 text-sm text-white/80">Share ideas, images and reactions instantly.</p></div>
    </aside>
  </main>

  <div id="profileModal" class="fixed inset-0 z-50 hidden place-items-center bg-slate-900/50 p-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl"><div class="mb-5 flex items-center justify-between"><h2 class="text-xl font-bold">Your profile</h2><button data-close="profileModal" class="text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button></div><div class="flex items-center gap-4"><img id="modalAvatar" class="h-20 w-20 rounded-2xl object-cover" alt="Profile"><label class="cursor-pointer rounded-xl bg-slate-100 px-3 py-2 text-sm font-semibold hover:bg-slate-200"><i class="fa-solid fa-camera mr-2"></i>Change photo<input id="avatarInput" type="file" accept="image/*" class="hidden"></label></div><label class="mt-5 block text-sm font-semibold">Display name<input id="nameInput" maxlength="40" class="mt-2 w-full rounded-xl border border-slate-200 px-3 py-3" placeholder="Your name"></label><button id="saveProfile" class="mt-5 w-full rounded-xl bg-brand py-3 font-bold text-white">Save profile</button></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
